
[general]
	#Default enable for rendering trajectory prediction.
	"Render Trajectory" = true
	#If the current trajectory can hit target, play "Ding" sound to remind player.
	"Target Hit Sound" = false
	#Enable for cube shape trajectory.
	"Cube Trajectory" = true
	#Enable for line shape trajectory.
	"Line Trajectory" = false
	#Enable for hit location plane.
	"Hit Location Plane" = true
	#Set cube color R.
	#Range: 0 ~ 255
	"Cube Color R" = 255
	#Set cube color G.
	#Range: 0 ~ 255
	"Cube Color G" = 255
	#Set cube color B.
	#Range: 0 ~ 255
	"Cube Color B" = 255
	#Set cube color A.
	#Range: 0 ~ 255
	"Cube Color A" = 40
	#Set cube size.
	#Range: 0.0 ~ 10.0
	"Cube Size" = 0.1
	#Set line color R.
	#Range: 0 ~ 255
	"Line Color R" = 255
	#Set line color G.
	#Range: 0 ~ 255
	"Line Color G" = 255
	#Set line color B.
	#Range: 0 ~ 255
	"Line Color B" = 255
	#Set line color A.
	#Range: 0 ~ 255
	"Line Color A" = 255
	#Set line size.
	#Range: 1.0 ~ 10.0
	"Line Width" = 4.0

